{% extends "layout.html" %}

{% block body %}

    <h1>Registrants</h1>

    {% if registrants %}
        <ul>
            {% for person in registrants %}
                <li>{{ person.name }} registered for {{ person.sport }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No registrants yet.</p>
    {% endif %}

    <a href="/">Back</a>

{% endblock %}
