<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Froshims Registration</title>
</head>
<body>

    <h1>Register</h1>

    <form action="/register" method="post">
        <input name="name" type="text" placeholder="Name">

        <select name="sport">
            <option disabled selected>Choose a sport</option>
            {% for sport in sports %}
                <option value="{{ sport }}">{{ sport }}</option>
            {% endfor %}
        </select>

        <button type="submit">Register</button>
    </form>

    <br>
    <a href="/registrants">View Registrants</a>

</body>
</html>
