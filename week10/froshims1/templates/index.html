{% extends "layout.html" %}

{% block body %}

    <h1>Register for a Sport</h1>

    <form action="/register" method="post">

        <input name="name" type="text" placeholder="Name">

        <select name="sport">
            <option value="">Choose a sport</option>
            {% for sport in sports %}
                <option value="{{ sport }}">{{ sport }}</option>
            {% endfor %}
        </select>

        <button type="submit">Register</button>

    </form>

{% endblock %}
