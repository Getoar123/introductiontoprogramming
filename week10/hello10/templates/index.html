{% extends "layout.html" %}

{% block body %}

    {% if name %}
        <h1>Hello, {{ name }}!</h1>
    {% else %}
        <h1>Hello, world!</h1>
    {% endif %}

    <form action="/" method="post">
        <input name="name" type="text" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

    <p>Or try: <code>/?name=Getoar</code></p>

{% endblock %}
